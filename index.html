<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#05090b">
    <meta name="description" content="AREVYS — Gym y Fitness">
    <link rel="manifest" href="manifest.webmanifest?v=69">
    <link rel="stylesheet" href="styles.css?v=69">
    <link rel="stylesheet" href="arevys-app.css?v=69">
    <title>AREVYS</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="intro" class="intro" aria-label="Configuración inicial AREVYS">
        <img id="introFrame" class="intro__frame" src="assets/intro_frames/frame_000.webp" alt="">
        <div class="intro__shade"></div>

        <header class="intro__header">
          <img src="assets/images/arevys_intro_logo.png" alt="AREVYS">
          <span id="stepCount">01 / 08</span>
        </header>

        <div id="introBrand" class="intro__brand" aria-hidden="true">
          <img src="assets/images/arevys_intro_logo.png" alt="">
          <span>GYM Y FITNESS</span>
        </div>

        <aside class="intro__rail" aria-hidden="true">
          <span>DESLIZA</span>
          <i><b id="railFill"></b></i>
          <strong>↑</strong>
        </aside>

        <div id="introCopy" class="intro__copy"></div>
        <div id="introHitArea" class="intro__gesture" aria-label="Desliza para avanzar"></div>
      </section>

      <section id="home" class="home" hidden aria-live="polite">
        <div id="dashboardContent"></div>
        <nav id="appNav" class="app-nav" aria-label="Navegación principal"></nav>
      </section>
    </main>
    <div id="toast" class="app-toast" role="status" aria-live="polite"></div>
    <script src="arevys-core.js?v=69"></script>
    <script src="app.js?v=69"></script>
  </body>
</html>
